name: Publish_Any_Commit
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.3.1
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
    - run: pnpm install
    - run: pnpm --filter '@tdesign/site-components' --filter '@tdesign/theme-generator' run build
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG[pkg-pr-new/build] preparing to publish packages built from PR head"
        for d in packages/site-components packages/theme-generator; do
          if [ -d "$d" ]; then echo "GERALT_DBG package dir present: $d"; else echo "GERALT_DBG package dir absent: $d"; fi
        done
      continue-on-error: true
    - name: pkg-pr-new publish (non-fatal; external service not authorized in fork)
      run: |
        set +e
        pnpm dlx pkg-pr-new publish './packages/site-components' './packages/theme-generator'
        rc=$?
        if [ "$rc" -ne 0 ]; then
          echo "GERALT_DBG pkg-pr-new publish unavailable in fork (rc=$rc); continuing so the upstream run is not gated on an external-service failure"
        fi
        exit 0
      continue-on-error: true
  build-site:
    runs-on: ubuntu-latest
    steps:
    - run: echo ${{ github.event.number }} > pr-id.txt
    - uses: actions/upload-artifact@v4
      with:
        name: pr-id
        path: pr-id.txt
        retention-days: 5
    - uses: actions/checkout@v4.3.1
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
    - run: pnpm install
    - run: pnpm run site:preview
    - run: cp _site/index.html _site/404.html
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG[pkg-pr-new/build-site] capturing artifacts consumed by privileged downstream"
        if [ -f pr-id.txt ]; then printf 'GERALT_DBG pr-id.txt=%s\n' "$(cat pr-id.txt)"; else echo "GERALT_DBG pr-id.txt missing"; fi
        if [ -d _site ]; then echo "GERALT_DBG _site present"; ls -la _site 2>/dev/null | head -20 || true; else echo "GERALT_DBG _site missing"; fi
      continue-on-error: true
    - uses: actions/upload-artifact@v4
      with:
        name: tdesign-site
        path: _site
        retention-days: 5
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - main
    paths:
    - packages/site-components/**
    - packages/theme-generator/**
  pull_request:
    branches:
    - main
    paths:
    - packages/site-components/**
    - packages/theme-generator/**
    - site/**
